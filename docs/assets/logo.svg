<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="c1-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#040711"/>
    </linearGradient>
    <linearGradient id="c1-loop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="c1-blade" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="40%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="c1-rust" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <filter id="c1-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0284C7" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#c1-bg)" stroke="#1E293B" stroke-width="2"/>
  
  <g transform="translate(8, 0)" filter="url(#c1-glow)">
    <!-- Top Torus Loop of the 9 -->
    <path d="M 248 100 C 314 100 368 154 368 220 C 368 286 314 340 248 340 C 182 340 128 286 128 220 C 128 154 182 100 248 100 Z M 248 164 C 217 164 192 189 192 220 C 192 251 217 276 248 276 C 279 276 304 251 304 220 C 304 189 279 164 248 164 Z" 
          fill="url(#c1-loop)" />
    <!-- Inner Bevel Highlight -->
    <circle cx="248" cy="220" r="84" fill="none" stroke="white" stroke-width="1.5" stroke-opacity="0.25"/>
    
    <!-- Razor Blade Tail -->
    <path d="M 368 210 L 368 280 C 368 340 330 385 275 425 L 210 425 C 270 380 304 340 304 285 L 304 210 Z" 
          fill="url(#c1-blade)" />
    
    <!-- Rust Energy Spark -->
    <path d="M 344 260 L 368 210 L 304 210 Z" fill="url(#c1-rust)"/>
    <circle cx="210" cy="425" r="9" fill="url(#c1-rust)"/>
    
    <!-- Specular High-Velocity Edge -->
    <path d="M 368 210 L 368 280 C 368 340 330 385 275 425" fill="none" stroke="#7DD3FC" stroke-width="3" stroke-linecap="round"/>
  </g>

  <text x="256" y="475" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" letter-spacing="8" fill="#94A3B8" opacity="0.8">NINESQL</text>
</svg>
