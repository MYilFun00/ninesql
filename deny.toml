# cargo-deny policy (ADR-0002), run by CI:  cargo deny --locked check
# Lifting a ban or adding a license requires a security-reviewer review, and an ADR
# when it touches an invariant.

[graph]
all-features = true

[advisories]
# Advisories are checked in CI; an ignore needs a reason and a security-reviewer review.
ignore = []

[licenses]
# Licenses compatible with distributing NineSQL under Apache-2.0 (ADR-0002, invariant I7).
# Zed's GPL crates (editor, language, project, workspace…) are rejected here by their license.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # TLS: rustls only (ADR-0011).
    { name = "openssl", reason = "rustls only (ADR-0011)" },
    { name = "openssl-sys", reason = "rustls only (ADR-0011)" },
    { name = "openssl-src", reason = "rustls only (ADR-0011)" },
    { name = "native-tls", reason = "rustls only (ADR-0011)" },
    # No webview (ADR-0001).
    { name = "wry", reason = "no webview (ADR-0001)" },
    { name = "tauri", reason = "no webview (ADR-0001)" },
    { name = "webkit2gtk", reason = "no webview (ADR-0001)" },
    # No JVM (ADR-0001, ADR-0003).
    { name = "jni", reason = "no JVM (ADR-0001)" },
    { name = "j4rs", reason = "no JVM (ADR-0001)" },
    # SSH through russh, not libssh2 (ADR-0011).
    { name = "ssh2", reason = "russh only (ADR-0011)" },
    { name = "libssh2-sys", reason = "russh only (ADR-0011)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# GPUI and gpui-component are git dependencies (ADR-0001).
allow-git = [
    "https://github.com/zed-industries/zed",
    "https://github.com/longbridge/gpui-component",
]
